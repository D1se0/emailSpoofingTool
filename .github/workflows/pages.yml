name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web (React + esbuild)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          mkdir -p build
          cp src/index.html build/
          cp src/styles.css build/app.css
          npm run build

      - name: Add SPA 404 fallback
        working-directory: web/build
        run: cp index.html 404.html

      - name: Inject API notice banner for static hosting
        working-directory: web/build
        run: |
          cat > api-notice.txt <<'EOF'
          Modo estático (GitHub Pages): el Analyzer necesita la API local.
          Ejecuta: cd server && npm start  →  http://localhost:8787
          EOF
          true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
